steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/fornax-apps/cyrus-portfolio/cyrus-portfolio:$COMMIT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/fornax-apps/cyrus-portfolio/cyrus-portfolio:latest'
      - '.'

  # Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/fornax-apps/cyrus-portfolio/cyrus-portfolio:$COMMIT_SHA'

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'cyrus-portfolio-prod'
      - '--image'
      - 'us-central1-docker.pkg.dev/fornax-apps/cyrus-portfolio/cyrus-portfolio:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-secrets'
      - 'RAILS_MASTER_KEY=rails-master-key:latest'

images:
  - 'us-central1-docker.pkg.dev/fornax-apps/cyrus-portfolio/cyrus-portfolio:$COMMIT_SHA'
  - 'us-central1-docker.pkg.dev/fornax-apps/cyrus-portfolio/cyrus-portfolio:latest'
