service: cyrus_portfolio
image: chrisbaptiste83/cyrus_portfolio

servers:
  web:
    - 34.186.189.82

ssh:
  user: root

proxy:
  ssl: true
  host: cyrusbaptiste.com
  healthcheck:
    timeout: 60

registry:
  username: chrisbaptiste83
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - RAILS_MASTER_KEY
    - DATABASE_URL
    - SMTP_USERNAME
    - SMTP_PASSWORD
    - GOOGLE_CREDENTIALS_JSON
  clear:
    SOLID_QUEUE_IN_PUMA: true

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"

# Active Storage uses GCS — no local storage volume needed.
# Postgres runs in tethered-db on the shared kamal Docker network.

asset_path: /rails/public/assets

builder:
  arch: amd64
