stages:
  - test
  - build
  - deploy

variables:
  PROJECT_ID: gcp-dev-sandbox-495101
  REGION: us-central1
  SERVICE: cyrus-portfolio-prod
  IMAGE: us-central1-docker.pkg.dev/fornax-apps/cyrus-portfolio
  RAILS_MASTER_KEY_SECRET: cyrus-portfolio-rails-master-key-prod

# ── Test ──────────────────────────────────────────────────────────────────────

test:
  stage: test
  image: ruby:3.4.2-slim
  services:
    - postgres:16-alpine
  variables:
    POSTGRES_DB: cyrus_portfolio_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    DATABASE_URL: postgresql://postgres:postgres@postgres/cyrus_portfolio_test
    RAILS_ENV: test
    BUNDLE_WITHOUT: ""
  before_script:
    - apt-get update -qq && apt-get install -y build-essential libpq-dev nodejs git libyaml-dev
    - gem install bundler --no-document
    - bundle install --jobs 4 --retry 3
    - bundle exec rails db:schema:load
  script:
    - bundle exec rspec --format progress
    - bundle exec brakeman -q --no-pager
    - bundle exec bundle-audit check --update
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ── Build ─────────────────────────────────────────────────────────────────────

build:
  stage: build
  image: google/cloud-sdk:slim
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  id_tokens:
    GITLAB_ID_TOKEN:
      aud: ${GCP_WORKLOAD_IDENTITY_PROVIDER}
  before_script:
    - apt-get update -qq && apt-get install -y docker.io
    - echo "$GITLAB_ID_TOKEN" > /tmp/oidc-token
    - gcloud iam workload-identity-pools create-cred-config ${GCP_WORKLOAD_IDENTITY_PROVIDER}
      --output-file=/tmp/cred-config.json
      --credential-source-file=/tmp/oidc-token
      --credential-source-type=text
    - gcloud auth login --cred-file=/tmp/cred-config.json
    - gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
    - gcloud config set project $PROJECT_ID
    - gcloud secrets versions access latest --secret=${RAILS_MASTER_KEY_SECRET} > /tmp/rails_master_key
  script:
    - export DOCKER_BUILDKIT=1
    - docker build --secret id=rails_master_key,src=/tmp/rails_master_key -t $IMAGE:$CI_COMMIT_SHA -t $IMAGE:latest .
    - docker push $IMAGE:$CI_COMMIT_SHA
    - docker push $IMAGE:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ── Deploy ────────────────────────────────────────────────────────────────────

deploy:
  stage: deploy
  image: google/cloud-sdk:slim
  id_tokens:
    GITLAB_ID_TOKEN:
      aud: ${GCP_WORKLOAD_IDENTITY_PROVIDER}
  before_script:
    - echo "$GITLAB_ID_TOKEN" > /tmp/oidc-token
    - gcloud iam workload-identity-pools create-cred-config ${GCP_WORKLOAD_IDENTITY_PROVIDER}
      --output-file=/tmp/cred-config.json
      --credential-source-file=/tmp/oidc-token
      --credential-source-type=text
    - gcloud auth login --cred-file=/tmp/cred-config.json
    - gcloud config set project $PROJECT_ID
  script:
    - |
      gcloud run deploy $SERVICE \
        --image $IMAGE:$CI_COMMIT_SHA \
        --region $REGION \
        --project $PROJECT_ID \
        --service-account cyrus-portfolio-service@${PROJECT_ID}.iam.gserviceaccount.com \
        --set-secrets=RAILS_MASTER_KEY=${RAILS_MASTER_KEY_SECRET}:latest \
        --quiet
  environment:
    name: production
    url: ${PRODUCTION_URL}
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
