stages:
  - test
  - build
  - deploy

variables:
  PROJECT_ID: trinitas-forge
  REGION: us-west1
  SERVICE: cyrus-portfolio
  IMAGE: us-west1-docker.pkg.dev/trinitas-forge/app-images/cyrus-portfolio
  RAILS_MASTER_KEY_SECRET: cyrus-portfolio-rails-master-key

# ── Test ──────────────────────────────────────────────────────────────────────

test:
  stage: test
  image: ruby:3.4.2-slim
  services:
    - postgres:16-alpine
  variables:
    POSTGRES_DB: cyrus_portfolio_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    DATABASE_URL: postgresql://postgres:postgres@postgres/cyrus_portfolio_test
    RAILS_ENV: test
    BUNDLE_WITHOUT: ""
  before_script:
    - apt-get update -qq && apt-get install -y build-essential libpq-dev nodejs git libyaml-dev libcurl4
    - gem install bundler --no-document
    - bundle install --jobs 4 --retry 3
    - bundle exec rails db:schema:load
  script:
    - bundle exec rspec --format progress
    - bundle exec brakeman -q --no-pager
    - bundle exec bundle-audit check --update
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ── Build ─────────────────────────────────────────────────────────────────────

build:
  stage: build
  image: google/cloud-sdk:slim
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  id_tokens:
    GITLAB_ID_TOKEN:
      aud: ${GCP_WORKLOAD_IDENTITY_PROVIDER}
  before_script:
    - apt-get update -qq && apt-get install -y docker.io
    - echo "$GITLAB_ID_TOKEN" > /tmp/oidc-token
    - gcloud iam workload-identity-pools create-cred-config ${GCP_WORKLOAD_IDENTITY_PROVIDER}
      --output-file=/tmp/cred-config.json
      --credential-source-file=/tmp/oidc-token
      --credential-source-type=text
    - gcloud auth login --cred-file=/tmp/cred-config.json
    - gcloud auth configure-docker us-west1-docker.pkg.dev --quiet
    - gcloud config set project $PROJECT_ID
    - gcloud secrets versions access latest --secret=${RAILS_MASTER_KEY_SECRET} > /tmp/rails_master_key
  script:
    - export DOCKER_BUILDKIT=1
    - docker build --secret id=rails_master_key,src=/tmp/rails_master_key -t $IMAGE:$CI_COMMIT_SHA -t $IMAGE:latest .
    - docker push $IMAGE:$CI_COMMIT_SHA
    - docker push $IMAGE:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ── Deploy ────────────────────────────────────────────────────────────────────

deploy:
  stage: deploy
  image: google/cloud-sdk:slim
  id_tokens:
    GITLAB_ID_TOKEN:
      aud: ${GCP_WORKLOAD_IDENTITY_PROVIDER}
  before_script:
    - echo "$GITLAB_ID_TOKEN" > /tmp/oidc-token
    - gcloud iam workload-identity-pools create-cred-config ${GCP_WORKLOAD_IDENTITY_PROVIDER}
      --output-file=/tmp/cred-config.json
      --credential-source-file=/tmp/oidc-token
      --credential-source-type=text
    - gcloud auth login --cred-file=/tmp/cred-config.json
    - gcloud config set project $PROJECT_ID
  script:
    - |
      gcloud run deploy $SERVICE \
        --image $IMAGE:$CI_COMMIT_SHA \
        --region $REGION \
        --project $PROJECT_ID \
        --service-account cyrus-portfolio-service@${PROJECT_ID}.iam.gserviceaccount.com \
        --vpc-connector run-to-vpc \
        --vpc-egress private-ranges-only \
        --port 80 \
        --cpu 1 \
        --memory 1Gi \
        --no-cpu-throttling \
        --cpu-boost \
        --min-instances 1 \
        --max-instances 20 \
        --allow-unauthenticated \
        --set-env-vars=RAILS_ENV=production,RAILS_LOG_LEVEL=info,SOLID_QUEUE_IN_PUMA=true,WEB_CONCURRENCY=1,RAILS_MAX_THREADS=10 \
        --set-secrets=RAILS_MASTER_KEY=${RAILS_MASTER_KEY_SECRET}:latest,DATABASE_URL=cyrus-portfolio-database-url:latest,IMAGEKIT_ENDPOINT=cyrus-portfolio-imagekit-endpoint:latest,MUX_TOKEN_ID=cyrus-portfolio-mux-token-id:latest,MUX_TOKEN_SECRET=cyrus-portfolio-mux-secret-key:latest,MUX_WEBHOOK_SECRET=cyrus-portfolio-mux-webhook-secret:latest,SMTP_ADDRESS=cyrus-portfolio-smtp-address:latest,SMTP_USERNAME=cyrus-portfolio-smtp-username:latest,SMTP_PASSWORD=cyrus-portfolio-smtp-password:latest \
        --quiet
  environment:
    name: production
    url: ${PRODUCTION_URL}
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
